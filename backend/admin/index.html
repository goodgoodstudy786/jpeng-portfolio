<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPENG CMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0a0a;color:#f5f5f5;display:flex;min-height:100vh}
.sidebar{width:220px;background:#111;padding:30px 0;border-right:1px solid rgba(255,255,255,0.06);flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h2{font-size:1.1rem;padding:0 24px 24px;color:#C0FE27;letter-spacing:2px;font-weight:700}
.sidebar a{display:block;padding:12px 24px;color:rgba(255,255,255,0.5);text-decoration:none;font-size:0.85rem;transition:all 0.2s;border-left:2px solid transparent}
.sidebar a:hover,.sidebar a.active{color:#fff;background:rgba(192,254,39,0.06);border-left-color:#C0FE27}
.main{flex:1;padding:30px 40px;overflow-y:auto;max-width:1200px}
.main h1{font-size:1.5rem;margin-bottom:30px;color:#C0FE27;letter-spacing:1px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:0.78rem;color:rgba(255,255,255,0.5);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase}
input,textarea,select{width:100%;padding:10px 14px;background:#181818;border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#f5f5f5;font-size:0.9rem;transition:border-color 0.2s;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:#C0FE27}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:600px){.row{grid-template-columns:1fr 1fr}}
.btn{padding:10px 24px;background:#C0FE27;color:#000;border:none;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn:hover{background:#9ddb10;transform:translateY(-1px)}
.btn-sm{padding:6px 14px;font-size:0.78rem}
.btn-danger{background:#ff4757;color:#fff}
.btn-danger:hover{background:#e04050}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7)}
.btn-outline:hover{border-color:#C0FE27;color:#C0FE27;background:rgba(192,254,39,0.06)}
.card-list{display:flex;flex-direction:column;gap:12px}
.card-item{background:#181818;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.card-item .info{flex:1}
.card-item .info h4{font-size:0.95rem;margin-bottom:4px}
.card-item .info p{font-size:0.78rem;color:rgba(255,255,255,0.4)}
.card-item .actions{display:flex;gap:8px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
.modal.open{display:flex}
.modal-content{background:#181818;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:30px;width:90%;max-width:700px;max-height:80vh;overflow-y:auto}
.modal-content h3{margin-bottom:20px;color:#C0FE27}
.modal-actions{display:flex;gap:12px;margin-top:20px;justify-content:flex-end}
.toast{position:fixed;bottom:30px;right:30px;background:#C0FE27;color:#000;padding:12px 24px;border-radius:10px;font-weight:600;font-size:0.85rem;opacity:0;transition:opacity 0.3s;z-index:2000}
.toast.show{opacity:1}

/* ── Redesigned Login ── */
.login-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;background:#0a0a0a}
.login-overlay::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(192,254,39,0.08) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(192,254,39,0.05) 0%,transparent 50%);pointer-events:none}
.login-overlay::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(192,254,39,0.03),transparent,rgba(192,254,39,0.03),transparent);animation:loginRotate 20s linear infinite;pointer-events:none}
@keyframes loginRotate{to{transform:rotate(360deg)}}
.login-overlay.hidden{display:none}
.login-box{position:relative;width:400px;padding:48px 40px 40px;background:linear-gradient(135deg,rgba(20,20,20,0.95),rgba(15,15,15,0.98));border:1px solid rgba(192,254,39,0.1);border-radius:24px;text-align:center;z-index:1;backdrop-filter:blur(20px);box-shadow:0 24px 80px rgba(0,0,0,0.6),0 0 40px rgba(192,254,39,0.03);animation:loginSlideIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards}
@keyframes loginSlideIn{0%{opacity:0;transform:translateY(30px) scale(0.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.login-box::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(192,254,39,0.2),transparent 40%,transparent 60%,rgba(192,254,39,0.1));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:exclude;mask-composite:exclude;pointer-events:none}
.login-logo{font-family:"Sora",sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#C0FE27,#8fcf1a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.login-sub{font-size:0.75rem;color:rgba(255,255,255,0.3);letter-spacing:3px;margin-bottom:36px;text-transform:uppercase}
.login-box .form-group{margin-bottom:20px;text-align:left}
.login-box label{font-size:0.7rem;color:rgba(255,255,255,0.4);letter-spacing:1.5px;margin-bottom:8px;display:block;text-transform:uppercase}
.login-input-wrap{position:relative;display:flex;align-items:center}
.login-input-wrap input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#f5f5f5;font-size:0.9rem;transition:all 0.3s ease;font-family:inherit}
.login-input-wrap input:focus{border-color:#C0FE27;background:rgba(192,254,39,0.04);box-shadow:0 0 20px rgba(192,254,39,0.06)}
.login-input-wrap input::placeholder{color:rgba(255,255,255,0.15)}
.login-pwd-toggle{position:absolute;right:12px;background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:1.1rem;padding:4px;transition:color 0.2s;z-index:2;line-height:1}
.login-pwd-toggle:hover{color:#C0FE27}
.login-error{color:#ff4757;font-size:0.78rem;margin-top:10px;display:none;text-align:center}
.login-error.show{display:block}
.login-box .btn{width:100%;padding:14px;margin-top:8px;font-size:0.9rem;font-weight:600;border-radius:12px;background:linear-gradient(135deg,#C0FE27,#9ddb10);color:#000;border:none;cursor:pointer;transition:all 0.3s ease;letter-spacing:1px}
.login-box .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(192,254,39,0.25)}
.login-box .btn:active{transform:translateY(0)}
.login-footer-text{font-size:0.65rem;color:rgba(255,255,255,0.15);margin-top:24px;letter-spacing:1px}
.login-grid-bg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.login-grid-bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(192,254,39,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(192,254,39,0.02) 1px,transparent 1px);background-size:40px 40px}
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
<div class="login-grid-bg"></div>
<div class="login-box">
<div class="login-logo">JPENG</div>
<div class="login-sub">Content Management System</div>
<div class="form-group"><label>Username</label><div class="login-input-wrap"><input id="login-user" placeholder="Enter your username" autocomplete="username" /></div></div>
<div class="form-group"><label>Password</label><div class="login-input-wrap"><input id="login-pass" type="password" placeholder="Enter your password" autocomplete="current-password" /><button class="login-pwd-toggle" id="pwdToggle" type="button">&#x1f441;</button></div></div>
<div class="login-error" id="loginError">Invalid credentials</div>
<button class="btn" id="loginBtn">Sign In</button>
<div class="login-footer-text">JPENG &middot; Portfolio CMS</div>
</div></div>
<nav class="sidebar"><h2>JPENG &middot; CMS</h2>
<a href="#" class="active" data-section="site">网站设置</a>
<a href="#" data-section="nav">导航菜单</a>
<a href="#" data-section="hero">Banner 设置</a>
<a href="#" data-section="projects">精选作品</a>
<a href="#" data-section="strengths">个人优势</a>
<a href="#" data-section="inspirations">灵感收藏</a>
<a href="#" data-section="contact">联系方式</a>
</nav>
<div class="main" id="app"><h1 id="section-title">网站设置</h1><div id="content"></div></div>
<div class="modal" id="modal"><div class="modal-content" id="modal-content"></div></div>
<div class="toast" id="toast">保存成功</div>
<script>const API = "";
let data = {};
let token = localStorage.getItem("jpeng-cms-token") || "";
function setToken(t) { token = t; localStorage.setItem("jpeng-cms-token", t); }
function clearToken() { token = ""; localStorage.removeItem("jpeng-cms-token"); }

async function checkAuth() {
  if (!token) return false;
  try {
    const r = await fetch("/api/check-auth", { headers: { Authorization: "Bearer " + token } });
    if (r.ok) { const d = await r.json(); return d.authenticated; }
  } catch(e) {}
  return false;
}

document.addEventListener("DOMContentLoaded", async function() {
  const a = await checkAuth();
  if (a) { document.getElementById("loginOverlay").classList.add("hidden"); await loadData(); renderSite(); }
});
// ── Password toggle ──
document.addEventListener("DOMContentLoaded", function() {
  const toggleBtn = document.getElementById("pwdToggle");
  const pwdInput = document.getElementById("login-pass");
  if (toggleBtn && pwdInput) {
    toggleBtn.addEventListener("click", function() {
      const type = pwdInput.getAttribute("type") === "password" ? "text" : "password";
      pwdInput.setAttribute("type", type);
      toggleBtn.textContent = type === "password" ? "👁" : "👁‍🗨";
    });
  }
});

function doLogin() {
  const u = document.getElementById("login-user").value;
  const p = document.getElementById("login-pass").value;
  document.getElementById("loginError").classList.remove("show");
  fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u, password: p })
  }).then(function(r) {
    if (!r.ok) { document.getElementById("loginError").classList.add("show"); return null; }
    return r.json();
  }).then(function(d) {
    if (!d) return;
    setToken(d.token);
    document.getElementById("loginOverlay").classList.add("hidden");
    loadData().then(function() { renderSite(); });
  }).catch(function() { document.getElementById("loginError").classList.add("show"); });
}

document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("login-pass").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doLogin();
});

function doLogout() { clearToken(); document.getElementById("loginOverlay").classList.remove("hidden"); }
function toast(m) { const e = document.getElementById("toast"); e.textContent = m; e.classList.add("show"); setTimeout(function() { e.classList.remove("show"); }, 2000); }

async function fetchAPI(url, o) {
  o = o || {}; o.headers = o.headers || {}; o.headers["Content-Type"] = "application/json";
  if (token) o.headers["Authorization"] = "Bearer " + token;
  const r = await fetch(url, o); if (!r.ok) throw new Error(await r.text()); return r.json();
}

async function loadData() { data = await fetchAPI("/api/data"); }

function openModal(h) { document.getElementById("modal-content").innerHTML = h; document.getElementById("modal").classList.add("open"); }
function closeModal() { document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").addEventListener("click", function(e) { if (e.target === e.currentTarget) closeModal(); });

var sections = { site: renderSite, nav: renderNav, hero: renderHero, projects: renderProjects, strengths: renderStrengths, inspirations: renderInspirations, contact: renderContact };

function esc(s) { if (!s) return ""; return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

// 鈹€鈹€ Site 鈹€鈹€
function renderSite() {
  document.getElementById("section-title").textContent = "网站设置";
  document.getElementById("content").innerHTML = '<div class="row"><div class="form-group"><label>Logo 文字</label><input id="site-logo" value="' + esc(data.site.logo) + '" /></div><div class="form-group"><label>底部版权文字</label><input id="site-footer" value="' + esc(data.site.footer) + '" /></div></div><button class="btn" onclick="saveSite()">保存设置</button><button class="btn btn-danger" style="margin-left:10px" onclick="doLogout()">閫€鍑虹櫥褰?/button>';
}
async function saveSite() { await fetchAPI("/api/site", { method: "PUT", body: JSON.stringify({ logo: document.getElementById("site-logo").value, footer: document.getElementById("site-footer").value }) }); toast("宸蹭繚瀛"); }

// 鈹€鈹€ Nav 鈹€鈹€
function renderNav() {
  document.getElementById("section-title").textContent = "导航菜单";
  var h = '<div class="card-list">';
  data.nav.forEach(function(item, i) { h += '<div class="card-item"><div class="info"><h4>' + esc(item.label) + '</h4><p>' + esc(item.href) + '</p></div><div class="actions"><button class="btn btn-sm btn-outline" onclick="editNav(' + i + ')">编辑</button></div></div>'; });
  h += '</div><button class="btn" style="margin-top:12px" onclick="addNav()">+ 添加导航</button><button class="btn" style="margin-top:12px;margin-left:10px" onclick="saveNavData()">保存导航</button>';
  document.getElementById("content").innerHTML = h;
}
function editNav(i) { var item = data.nav[i]; openModal('<h3>编辑瀵艰埅</h3><div class="form-group"><label>名称</label><input id="edit-nav-label" value="' + esc(item.label) + '" /></div><div class="form-group"><label>链接</label><input id="edit-nav-href" value="' + esc(item.href) + '" /></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn" onclick="saveNav(' + i + ')">淇濆瓨</button></div>'); }
function saveNav(i) { data.nav[i] = { label: document.getElementById("edit-nav-label").value, href: document.getElementById("edit-nav-href").value }; closeModal(); renderNav(); }
function addNav() { data.nav.push({ label: "新菜单", href: "/#new" }); renderNav(); }
async function saveNavData() { await fetchAPI("/api/nav", { method: "PUT", body: JSON.stringify(data.nav) }); toast("瀵艰埅宸蹭繚瀛"); }

// 鈹€鈹€ Hero 鈹€鈹€
function renderHero() {
  document.getElementById("section-title").textContent = "Banner 璁剧疆";
  var h = data.hero;
  document.getElementById("content").innerHTML = '<div class="row"><div class="form-group"><label>标语（英文）</label><input id="hero-tagline" value="' + esc(h.tagline) + '" /></div><div class="form-group"><label>鍓爣棰橈紙涓枃锛?/label><input id="hero-subtitle" value="' + esc(h.subtitle) + '" /></div></div><div class="row"><div class="form-group"><label>涓绘寜閽枃瀛?/label><input id="hero-btn-primary" value="' + esc(h.btnPrimary) + '" /></div><div class="form-group"><label>娆℃寜閽枃瀛?/label><input id="hero-btn-secondary" value="' + esc(h.btnSecondary) + '" /></div></div><div class="row"><div class="form-group"><label>城市锛圔ased in锛?/label><input id="hero-basedin" value="' + esc(h.basedIn) + '" /></div></div><button class="btn" onclick="saveHero()">保存设置</button>';
}
async function saveHero() { await fetchAPI("/api/hero", { method: "PUT", body: JSON.stringify({ tagline: document.getElementById("hero-tagline").value, subtitle: document.getElementById("hero-subtitle").value, btnPrimary: document.getElementById("hero-btn-primary").value, btnSecondary: document.getElementById("hero-btn-secondary").value, basedIn: document.getElementById("hero-basedin").value }) }); toast("Banner 宸蹭繚瀛"); }

// 鈹€鈹€ Projects 鈹€鈹€
function renderProjects() {
  document.getElementById("section-title").textContent = "精选作品";
  var h = '<div class="card-list">';
  data.projects.forEach(function(p) {
    h += '<div class="card-item"><div class="info"><h4>' + esc(p.title) + '</h4><p>' + esc(p.subtitle || "") + " " + (p.tags || []).join(", ") + '</p></div><div class="actions"><button class="btn btn-sm btn-outline" onclick="editProject(\'' + p.id + '\')">编辑</button><button class="btn btn-sm btn-danger" onclick="deleteProject(\'' + p.id + '\')">鍒犻櫎</button></div></div>';
  });
  h += '</div><button class="btn" style="margin-top:16px" onclick="addProject()">+ 添加作品</button>';
  document.getElementById("content").innerHTML = h;
}

function editProject(id) {
  var p = data.projects.find(function(x) { return x.id === id; });
  if (!p) return;
  openModal(
    '<h3>编辑浣滃搧</h3>' +
    '<div class="row"><div class="form-group"><label>标题</label><input id="ep-title" value="' + esc(p.title) + '" /></div><div class="form-group"><label>鑻辨枃鍓爣棰?/label><input id="ep-subtitle" value="' + esc(p.subtitle || "") + '" /></div></div>' +
    '<div class="row"><div class="form-group"><label>骞翠唤</label><input id="ep-year" value="' + esc(p.year || "") + '" /></div><div class="form-group"><label>瑙掕壊</label><input id="ep-role" value="' + esc(p.role || "") + '" /></div></div>' +
    '<div class="form-group"><label>鏍囩锛堥€楀彿鍒嗛殧锛?/label><input id="ep-tags" value="' + esc((p.tags || []).join(", ")) + '" /></div>' +
    '<div class="form-group"><label>姒傝堪</label><textarea id="ep-overview">' + esc(p.overview || "") + '</textarea></div>' +
    '<div class="form-group"><label>绔犺妭锛圝SON鏍煎紡锛?/label><textarea id="ep-sections" style="min-height:100px">' + esc(JSON.stringify(p.sections || [], null, 2)) + '</textarea></div>' +
    '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn" onclick="saveProject(\'' + id + '\')">淇濆瓨</button></div>'
  );
}

async function saveProject(id) {
  var idx = data.projects.findIndex(function(x) { return x.id === id; });
  if (idx === -1) return;
  var sections = [];
  try { sections = JSON.parse(document.getElementById("ep-sections").value); } catch(e) {}
  data.projects[idx] = {
    ...data.projects[idx],
    title: document.getElementById("ep-title").value,
    subtitle: document.getElementById("ep-subtitle").value,
    year: document.getElementById("ep-year").value,
    role: document.getElementById("ep-role").value,
    tags: document.getElementById("ep-tags").value.split(",").map(function(t) { return t.trim(); }).filter(function(t) { return t; }),
    overview: document.getElementById("ep-overview").value,
    sections: sections,
  };
  await fetchAPI("/api/projects/" + id, { method: "PUT", body: JSON.stringify(data.projects[idx]) });
  closeModal();
  renderProjects();
  toast("宸叉洿鏂");
}

async function deleteProject(id) {
  if (!confirm("确定删除？")) return;
  await fetchAPI("/api/projects/" + id, { method: "DELETE" });
  data.projects = data.projects.filter(function(p) { return p.id !== id; });
  renderProjects();
  toast("宸插垹闄");
}

function addProject() {
  var id = crypto.randomUUID();
  data.projects.push({ id: id, title: "新作品", subtitle: "New Project", year: "2026", tags: [], sections: [] });
  renderProjects();
}

// 鈹€鈹€ Strengths 鈹€鈹€
function renderStrengths() {
  document.getElementById("section-title").textContent = "涓汉浼樺娍";
  var h = '<div class="card-list">';
  data.strengths.forEach(function(s) {
    h += '<div class="card-item"><div class="info"><h4>' + esc(s.title) + '</h4><p>' + esc(s.titleCN) + " " + esc(s.desc) + '</p></div><div class="actions"><button class="btn btn-sm btn-outline" onclick="editStrength(\'' + s.id + '\')">编辑</button><button class="btn btn-sm btn-danger" onclick="deleteStrength(\'' + s.id + '\')">鍒犻櫎</button></div></div>';
  });
  h += '</div><button class="btn" style="margin-top:16px" onclick="addStrength()">+ 添加优势</button>';
  document.getElementById("content").innerHTML = h;
}

function editStrength(id) {
  var s = data.strengths.find(function(x) { return x.id === id; });
  if (!s) return;
  openModal(
    '<h3>编辑浼樺娍</h3>' +
    '<div class="row"><div class="form-group"><label>缂栧彿</label><input id="es-num" value="' + esc(s.num) + '" /></div><div class="form-group"><label>鑻辨枃标题</label><input id="es-title" value="' + esc(s.title) + '" /></div></div>' +
    '<div class="row"><div class="form-group"><label>中文标题</label><input id="es-titlecn" value="' + esc(s.titleCN) + '" /></div><div class="form-group"><label>鏍囩锛堥€楀彿鍒嗛殧锛?/label><input id="es-tags" value="' + esc((s.tags || []).join(", ")) + '" /></div></div>' +
    '<div class="form-group"><label>描述</label><textarea id="es-desc">' + esc(s.desc) + '</textarea></div>' +
    '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn" onclick="saveStrength(\'' + id + '\')">淇濆瓨</button></div>'
  );
}

async function saveStrength(id) {
  var idx = data.strengths.findIndex(function(x) { return x.id === id; });
  if (idx === -1) return;
  data.strengths[idx] = {
    ...data.strengths[idx],
    num: document.getElementById("es-num").value,
    title: document.getElementById("es-title").value,
    titleCN: document.getElementById("es-titlecn").value,
    desc: document.getElementById("es-desc").value,
    tags: document.getElementById("es-tags").value.split(",").map(function(t) { return t.trim(); }).filter(function(t) { return t; }),
  };
  await fetchAPI("/api/strengths/" + id, { method: "PUT", body: JSON.stringify(data.strengths[idx]) });
  closeModal();
  renderStrengths();
  toast("宸叉洿鏂");
}

async function deleteStrength(id) {
  if (!confirm("确定删除？")) return;
  await fetchAPI("/api/strengths/" + id, { method: "DELETE" });
  data.strengths = data.strengths.filter(function(s) { return s.id !== id; });
  renderStrengths();
  toast("宸插垹闄");
}

function addStrength() {
  var id = crypto.randomUUID();
  data.strengths.push({ id: id, num: "05", title: "New", titleCN: "新优势", desc: "描述", tags: [] });
  renderStrengths();
}

// 鈹€鈹€ Inspirations 鈹€鈹€
function renderInspirations() {
  document.getElementById("section-title").textContent = "灵感收藏";
  var h = '<div class="card-list">';
  data.inspirations.forEach(function(item) {
    h += '<div class="card-item"><div class="info"><h4>' + esc(item.title) + '</h4><p>' + esc(item.category) + " " + esc(item.subtitle || "") + '</p></div><div class="actions"><button class="btn btn-sm btn-outline" onclick="editInspiration(\'' + item.id + '\')">编辑</button><button class="btn btn-sm btn-danger" onclick="deleteInspiration(\'' + item.id + '\')">鍒犻櫎</button></div></div>';
  });
  h += '</div><button class="btn" style="margin-top:16px" onclick="addInspiration()">+ 添加灵感</button>';
  document.getElementById("content").innerHTML = h;
}

function editInspiration(id) {
  var item = data.inspirations.find(function(x) { return x.id === id; });
  if (!item) return;
  openModal(
    '<h3>编辑鐏垫劅</h3>' +
    '<div class="row"><div class="form-group"><label>标题</label><input id="ei-title" value="' + esc(item.title) + '" /></div><div class="form-group"><label>鑻辨枃鍓爣棰?/label><input id="ei-subtitle" value="' + esc(item.subtitle || "") + '" /></div></div>' +
    '<div class="row"><div class="form-group"><label>分类</label><input id="ei-category" value="' + esc(item.category) + '" /></div><div class="form-group"><label>鏉ユ簮链接</label><input id="ei-link" value="' + esc(item.link || "") + '" /></div></div>' +
    '<div class="form-group"><label>正文内容</label><textarea id="ei-content" style="min-height:150px">' + esc(item.content || "") + '</textarea></div>' +
    '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn" onclick="saveInspiration(\'' + id + '\')">淇濆瓨</button></div>'
  );
}

async function saveInspiration(id) {
  var idx = data.inspirations.findIndex(function(x) { return x.id === id; });
  if (idx === -1) return;
  data.inspirations[idx] = {
    ...data.inspirations[idx],
    title: document.getElementById("ei-title").value,
    subtitle: document.getElementById("ei-subtitle").value,
    category: document.getElementById("ei-category").value,
    link: document.getElementById("ei-link").value,
    content: document.getElementById("ei-content").value,
  };
  await fetchAPI("/api/inspirations/" + id, { method: "PUT", body: JSON.stringify(data.inspirations[idx]) });
  closeModal();
  renderInspirations();
  toast("宸叉洿鏂");
}

async function deleteInspiration(id) {
  if (!confirm("确定删除？")) return;
  await fetchAPI("/api/inspirations/" + id, { method: "DELETE" });
  data.inspirations = data.inspirations.filter(function(i) { return i.id !== id; });
  renderInspirations();
  toast("宸插垹闄");
}

function addInspiration() {
  var id = crypto.randomUUID();
  data.inspirations.push({ id: id, title: "新灵感", subtitle: "New Idea", category: "设计", content: "" });
  renderInspirations();
}

function renderContact() {
  document.getElementById("section-title").textContent = "联系方式";
  var c = data.contact;
  document.getElementById("content").innerHTML =
    '<div class="row"><div class="form-group"><label>Email</label><input id="c-email" value="' + esc(c.email) + '" /></div><div class="form-group"><label>寰俊</label><input id="c-wechat" value="' + esc(c.wechat) + '" /></div></div>' +
    '<div class="row"><div class="form-group"><label>电话</label><input id="c-phone" value="' + esc(c.phone) + '" /></div><div class="form-group"><label>标题</label><input id="c-headline" value="' + esc(c.headline) + '" /></div></div>' +
    '<div class="form-group"><label>描述鏂囧瓧</label><textarea id="c-blurb">' + esc(c.blurb) + '</textarea></div>' +
    '<button class="btn" onclick="saveContact()">保存设置</button>';
}
async function saveContact() { await fetchAPI("/api/contact", { method: "PUT", body: JSON.stringify({ email: document.getElementById("c-email").value, wechat: document.getElementById("c-wechat").value, phone: document.getElementById("c-phone").value, headline: document.getElementById("c-headline").value, blurb: document.getElementById("c-blurb").value }) }); toast("联系方式宸叉洿鏂"); }
